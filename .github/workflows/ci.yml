name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The harness spawns the runner's installed Google Chrome and loads the extension through
      # Extensions.loadUnpacked; xvfb provides a display in case headless is unavailable.
      - run: xvfb-run --auto-servernum npm run test:e2e
